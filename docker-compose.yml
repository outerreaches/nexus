services:
  nexus:
    build: .
    image: nexus-agent:dev
    environment:
      # LLM
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # Web search (optional)
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
      # Gmail API (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      # Credential vault (optional)
      NEXUS_CREDENTIALS_KEY: ${NEXUS_CREDENTIALS_KEY}
      # Persist state/config/workspace/history
      NEXUS_STATE_DIR: /data/nexus
      # Headless browser (Chromium in-container)
      NEXUS_BROWSER_EXECUTABLE_PATH: /usr/bin/chromium
      NEXUS_BROWSER_HEADLESS: "1"
      NEXUS_BROWSER_NO_SANDBOX: "1"
    volumes:
      - nexus_data:/data
    ports:
      - "18789:18789"
      # Gmail OAuth callback (used by `nexus gmail auth` inside the container)
      - "18790:18790"
    command: ["gateway", "--verbose"]

volumes:
  nexus_data:
