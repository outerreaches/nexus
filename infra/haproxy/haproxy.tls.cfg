global
    daemon
    maxconn 1000
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client 180s
    timeout server 180s
    timeout tunnel 180s
    log global
    option httplog
    option dontlognull

# Stats interface for debugging
frontend stats
    bind *:9999
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE

# Main frontend - receives all traffic
# TLS listener requires /usr/local/etc/haproxy/certs/nexus.pem.
frontend nexus_frontend
    bind *:18789
    bind *:18790 ssl crt /usr/local/etc/haproxy/certs/nexus.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    acl is_node_ws path_beg /nx/nodes
    acl is_websocket hdr(Upgrade) -i websocket
    use_backend nexus_nodes_ws_backend if is_node_ws is_websocket
    default_backend nexus_backend

# Default HTTP backend with primary + standby
backend nexus_backend
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200

    # Primary server - active by default
    server nexus-primary nexus-primary:18789 check inter 5s fall 3 rise 2

    # Standby server - only used if primary is down
    server nexus-standby nexus-standby:18789 check inter 5s fall 3 rise 2 backup

    # Retry on connection failure
    retries 2
    option redispatch

# Node websocket backend with explicit WS-friendly defaults
backend nexus_nodes_ws_backend
    balance roundrobin
    option httpchk
    # Node websocket traffic should target whichever gateway reports role=active.
    # This avoids tying node WS availability to full readiness checks.
    http-check send meth GET uri /api/mode ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    http-check expect string active
    timeout server 180s
    timeout tunnel 180s

    server nexus-primary nexus-primary:18789 check inter 5s fall 3 rise 2
    server nexus-standby nexus-standby:18789 check inter 5s fall 3 rise 2 backup

    retries 2
    option redispatch
