global
    daemon
    maxconn 1000
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 300s
    log global
    option httplog
    option dontlognull

# Stats interface for debugging
frontend stats
    bind *:9999
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE

# Main frontend - receives all traffic
frontend nexus_frontend
    bind *:18789
    default_backend nexus_backend

# Backend with primary + standby
backend nexus_backend
    balance roundrobin
    option httpchk GET /health/live HTTP/1.1\r\nHost:\ localhost
    http-check expect status 200

    # Primary server - active by default
    server nexus-primary nexus-primary:18789 check inter 5s fall 3 rise 2

    # Standby server - only used if primary is down
    server nexus-standby nexus-standby:18789 check inter 5s fall 3 rise 2 backup

    # Retry on connection failure
    retries 2
    option redispatch
