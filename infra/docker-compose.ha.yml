# Fault-tolerant Nexus deployment with hot standby
#
# Usage:
#   docker-compose -f infra/docker-compose.ha.yml up -d
#
# Architecture:
#   - HAProxy (port 18789) - load balancer with health checks
#   - nexus-primary - active instance
#   - nexus-standby - passive instance (--standby mode)
#   - watchdog - monitors primary, triggers failover if needed
#
# The standby instance:
#   - Responds to health checks
#   - Does NOT run scheduler, proactive, or telegram
#   - Can be activated via POST /api/activate
#
# Failover scenarios:
#   1. Watchdog detects active is traffic-unhealthy → activates standby services
#   2. HAProxy routes to whichever instance reports /health/traffic as healthy

services:
  # Load balancer - entry point for all traffic
  haproxy:
    image: haproxy:2.9-alpine
    command:
      - sh
      - -lc
      - exec haproxy -W -db -f "/usr/local/etc/haproxy/$${NEXUS_HAPROXY_CONFIG:-haproxy.cfg}"
    ports:
      - "18789:18789"   # Nexus API
      - "127.0.0.1:9999:9999"     # HAProxy stats (http://localhost:9999/stats)
    volumes:
      - ./haproxy:/usr/local/etc/haproxy:ro
    depends_on:
      - nexus-primary
      - nexus-standby
    restart: unless-stopped
    networks:
      - nexus-net

  # Primary Nexus instance (active)
  nexus-primary:
    build:
      context: ..
      dockerfile: Dockerfile
      target: gateway
    command: gateway --verbose
    # Match host deploy user to avoid root-owned artifacts on bind mounts.
    user: "${NEXUS_GATEWAY_UID:-1000}:${NEXUS_GATEWAY_GID:-1000}"
    volumes:
      # Persistent host state (reuse existing DB/backups/config)
      - ${NEXUS_HOST_STATE_DIR:-/data/nexus}:/data/nexus
      # Host code tree (writable for direct in-agent edits)
      - ${NEXUS_HOST_CODE_DIR:-/data/code}:/data/code
      # Persistent workspace
      - ${NEXUS_HOST_WORKSPACE_DIR:-/data/workspace}:/data/workspace
    environment:
      - NEXUS_STATE_DIR=/data/nexus
      - NEXUS_CODE_DIR=/data/code
      - NEXUS_WORKSPACE_DIR=/data/workspace
      # Force shell HOME to persistent state so ~/.ssh survives container rebuilds.
      - HOME=/data/nexus
      - NEXUS_ALLOW_CODE_WRITE=1
      - NEXUS_BROWSER_HEADLESS=1
      - NEXUS_BROWSER_NO_SANDBOX=1
      - NEXUS_HA_PEER_URL=http://nexus-standby:18789
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ${NEXUS_GATEWAY_ENV_FILE:-/data/nexus-config/gateway/nexus.env}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18789/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - nexus-net

  # Standby Nexus instance (passive until activated)
  nexus-standby:
    build:
      context: ..
      dockerfile: Dockerfile
      target: gateway
    command: gateway --verbose --standby
    # Match host deploy user to avoid root-owned artifacts on bind mounts.
    user: "${NEXUS_GATEWAY_UID:-1000}:${NEXUS_GATEWAY_GID:-1000}"
    volumes:
      # Same bind mounts as primary
      - ${NEXUS_HOST_STATE_DIR:-/data/nexus}:/data/nexus
      - ${NEXUS_HOST_CODE_DIR:-/data/code}:/data/code
      - ${NEXUS_HOST_WORKSPACE_DIR:-/data/workspace}:/data/workspace
    environment:
      - NEXUS_STATE_DIR=/data/nexus
      - NEXUS_CODE_DIR=/data/code
      - NEXUS_WORKSPACE_DIR=/data/workspace
      # Force shell HOME to persistent state so ~/.ssh survives container rebuilds.
      - HOME=/data/nexus
      - NEXUS_ALLOW_CODE_WRITE=1
      - NEXUS_BROWSER_HEADLESS=1
      - NEXUS_BROWSER_NO_SANDBOX=1
      - NEXUS_HA_PEER_URL=http://nexus-primary:18789
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ${NEXUS_GATEWAY_ENV_FILE:-/data/nexus-config/gateway/nexus.env}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18789/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - nexus-net

  # Watchdog - monitors health and triggers failover
  watchdog:
    build:
      context: ./watchdog
      dockerfile: Dockerfile
    volumes:
      # Mount state dir so watchdog can check deploy lock
      - ${NEXUS_HOST_STATE_DIR:-/data/nexus}:/data/nexus:ro
    environment:
      - PRIMARY_URL=http://nexus-primary:18789
      - STANDBY_URL=http://nexus-standby:18789
      - CHECK_INTERVAL=5
      - FAILURE_THRESHOLD=3
      - RECOVERY_DELAY=30
      - DEPLOY_LOCK_DIR=/data/nexus/ha-rollout.lock
    env_file:
      - ${NEXUS_WATCHDOG_ENV_FILE:-/data/nexus-config/watchdog/nexus.env}
    depends_on:
      - nexus-primary
      - nexus-standby
    restart: unless-stopped
    networks:
      - nexus-net

networks:
  nexus-net:
    driver: bridge
