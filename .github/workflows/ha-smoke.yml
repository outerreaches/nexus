name: HA Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  ha-smoke:
    name: HA Active/Standby Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare CI state
        run: |
          mkdir -p .ci-data/nexus .ci-data/workspace
          cp .env.example .env

      - name: Initialize Nexus state for CI
        env:
          NEXUS_STATE_DIR: ${{ github.workspace }}/.ci-data/nexus
          NEXUS_WORKSPACE_DIR: ${{ github.workspace }}/.ci-data/workspace
          NEXUS_CODE_DIR: ${{ github.workspace }}
        run: |
          npm run dev -- init --onboarding-json examples/init-onboarding.ci.json --force

      - name: Start HA stack
        run: |
          docker compose \
            -f infra/docker-compose.ha.yml \
            -f infra/docker-compose.ha.ci.yml \
            up -d --build haproxy nexus-primary nexus-standby

      - name: Run HA smoke
        run: npm run node:ha:smoke

      - name: Capture HA logs
        if: always()
        run: |
          docker compose \
            -f infra/docker-compose.ha.yml \
            -f infra/docker-compose.ha.ci.yml \
            ps
          docker compose \
            -f infra/docker-compose.ha.yml \
            -f infra/docker-compose.ha.ci.yml \
            logs --no-color > ha-compose.log || true

      - name: Stop HA stack
        if: always()
        run: |
          docker compose \
            -f infra/docker-compose.ha.yml \
            -f infra/docker-compose.ha.ci.yml \
            down -v --remove-orphans

      - name: Upload HA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha-smoke-logs
          path: |
            ha-compose.log
